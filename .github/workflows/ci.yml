name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m compileall -q main.py core modules tests

      - name: 核心单测
        run: python tests/test_core.py

      - name: 配置 schema JSON 校验
        run: python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
